<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bull Brock | Game Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,190,40,.10),transparent 30%),
    radial-gradient(circle at 80% 40%,rgba(255,120,0,.08),transparent 30%);
  z-index:-1;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,8,8,.94);
  border-bottom:1px solid rgba(255,193,7,.22);
  backdrop-filter:blur(12px);
}

.nav{
  max-width:1050px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ffd54a,#ff9800);
  color:#111;
  font-size:23px;
  box-shadow:0 0 20px rgba(255,180,0,.22);
}

.brand-name{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-name span{
  color:#ffc107;
}

.status{
  font-size:12px;
  color:#aaa;
}

/* HERO */

.hero{
  max-width:1050px;
  margin:auto;
  padding:55px 18px 30px;
  text-align:center;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:30px;
  background:rgba(255,193,7,.10);
  border:1px solid rgba(255,193,7,.30);
  color:#ffc107;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(34px,8vw,62px);
  line-height:1.05;
  font-weight:900;
  letter-spacing:-1px;
}

.hero h1 span{
  color:#ffc107;
  text-shadow:0 0 25px rgba(255,193,7,.18);
}

.hero p{
  margin:18px auto 0;
  max-width:600px;
  color:#999;
  font-size:16px;
  line-height:1.7;
}

/* SHOP */

.shop{
  max-width:1050px;
  margin:auto;
  padding:20px 18px 60px;
}

.section-title{
  text-align:center;
  margin-bottom:25px;
}

.section-title h2{
  font-size:28px;
}

.section-title p{
  color:#777;
  margin-top:7px;
}

/* PRODUCT */

.product{
  max-width:470px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,#171717,#0e0e0e);
  border:1px solid rgba(255,193,7,.25);
  border-radius:24px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    0 0 40px rgba(255,193,7,.06);
  transition:.3s;
}

.product:hover{
  transform:translateY(-4px);
  border-color:rgba(255,193,7,.5);
}

.hot{
  position:absolute;
  top:16px;
  right:16px;
  z-index:2;
  padding:7px 11px;
  border-radius:20px;
  background:#ff9800;
  color:#111;
  font-weight:900;
  font-size:11px;
}

/* PRODUCT IMAGE */

.product-image{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(255,193,7,.22),transparent 42%),
    linear-gradient(145deg,#222,#090909);
}

.product-image:before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  border:1px solid rgba(255,193,7,.18);
  box-shadow:
    0 0 45px rgba(255,193,7,.12),
    inset 0 0 35px rgba(255,193,7,.08);
}

.coin{
  position:relative;
  z-index:1;
  width:125px;
  height:125px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px;
  background:
    radial-gradient(circle at 35% 30%,#fff3a0,#ffc107 35%,#d88900 72%,#8b5200);
  border:7px solid #8c5700;
  box-shadow:
    0 12px 35px rgba(255,174,0,.3),
    inset 0 4px 10px rgba(255,255,255,.45);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* PRODUCT BODY */

.product-body{
  padding:24px;
}

.game-label{
  color:#ffc107;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
}

.product-title{
  font-size:27px;
  margin-top:7px;
  font-weight:900;
}

.server{
  display:inline-block;
  margin-top:10px;
  padding:7px 11px;
  border-radius:8px;
  background:#222;
  color:#ccc;
  font-size:13px;
}

.description{
  color:#999;
  line-height:1.7;
  margin-top:16px;
}

/* PRICE */

.price-row{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #292929;
}

.price-label{
  color:#777;
  font-size:12px;
}

.price{
  color:#ffc107;
  font-size:36px;
  font-weight:900;
  margin-top:3px;
}

.stock{
  color:#57d17b;
  font-size:12px;
  font-weight:bold;
}

/* BUTTON */

.order-button{
  width:100%;
  border:0;
  margin-top:22px;
  padding:17px;
  border-radius:13px;
  background:linear-gradient(135deg,#ffd54a,#ff9800);
  color:#111;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,152,0,.18);
  transition:.2s;
}

.order-button:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 35px rgba(255,152,0,.28);
}

.order-button:active{
  transform:scale(.98);
}

/* TRUST */

.trust{
  max-width:470px;
  margin:18px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.trust-box{
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:13px 5px;
  text-align:center;
}

.trust-box strong{
  display:block;
  font-size:17px;
}

.trust-box span{
  display:block;
  color:#777;
  font-size:10px;
  margin-top:4px;
}

/* ORDER BOX */

#orderBox{
  display:none;
  margin-top:18px;
  padding:20px;
  border-radius:16px;
  background:#101010;
  border:1px solid #292929;
}

#orderBox h3{
  margin-bottom:5px;
}

.order-note{
  color:#777;
  font-size:12px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:9px;
  background:#191919;
  color:#fff;
  border:1px solid #303030;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#ffc107;
}

.confirm{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-weight:bold;
  font-size:15px;
}

/* INFO */

.info{
  max-width:700px;
  margin:55px auto 0;
  text-align:center;
}

.info h2{
  font-size:25px;
}

.info p{
  margin-top:10px;
  color:#777;
  line-height:1.7;
}

/* FOOTER */

footer{
  margin-top:60px;
  border-top:1px solid #202020;
  padding:28px 18px;
  text-align:center;
  color:#555;
  font-size:12px;
}

footer strong{
  color:#888;
}

/* MOBILE */

@media(max-width:500px){

  .nav{
    padding:13px 14px;
  }

  .brand-name{
    font-size:18px;
  }

  .status{
